# PET v2 — nginx 配置（容器内）
# TLS 由前置层（路由器端口映射 / NAS 反代）终结，这里只管 HTTP。

# 本地 TTS：GET 只读缓存、POST 登录合成；单 IP 限流，防止被扫描刷爆 CPU。
limit_req_zone $binary_remote_addr zone=tts_local:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 前端静态产物（dist 内含 data/*.json、audio、img）
    root /usr/share/nginx/html;
    index index.html;

    # Excel 导入等上传；默认 1m 偏小
    client_max_body_size 10m;

    # 题库 JSON 约 1.9MB，压缩后明显更快
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain application/manifest+json;

    # 本地 TTS：GET 公开只读缓存 + POST 登录合成，共用同一路径。
    # 必须重复代理头与超时：nginx 不会从下面的 /api/ location 继承。
    location = /api/v1/speak/tts/local {
        limit_req zone=tts_local burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API 反代
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 文本接口偶有慢响应，默认 60s 偏紧
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 课程视频鉴权：FastAPI 校验 X-Media-Token（登录用户在 /api/v1/media/token 换取）。
    # auth_request 子请求没有原请求的 query，令牌须先在父 location 用 set 捕获。
    location = /_media_auth {
        internal;
        proxy_pass http://api:8000/api/v1/media/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Media-Token $media_token;
        proxy_set_header X-Original-URI $request_uri;
    }

    # 数学课程视频：只读卷挂载 NAS 媒体目录，sendfile 直出，支持 Range 拖动。
    # 必须是登录用户：前端把短时效媒体令牌拼在 ?mt= 里（AirPlay 由电视端取流，带不了 Cookie）。
    location /media/math/ {
        set $media_token $arg_mt;
        auth_request /_media_auth;
        alias /media/math/;
        add_header Cache-Control "private, max-age=3600";
        gzip off;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 数据清单会随构建更新，文件名不带哈希：每次用 ETag 协商，避免浏览器拿旧题库
    location ~* ^/data/.*\.json$ {
        add_header Cache-Control "no-cache";
    }

    # index.html 同理：确保地址栏刷新能拿到新构建
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA 清单：显式 MIME，避免个别 nginx 版本按 octet-stream 返回
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 听力音频：文件名稳定，给 7 天缓存；换文件后用户最多 7 天看到旧音频
    location ~* ^/audio/.*\.(mp3|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        gzip off;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
