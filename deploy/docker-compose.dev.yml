# PET v2 — NAS 开发/预发布环境（与生产 8088 并行）
#
# 独立目录 /vol1/1000/docker/pet-v2-dev、独立数据库、独立镜像 tag，
# 默认 8089 端口、PET_DEV_MODE=1（AI 接口返回模拟结果，不产生外部调用）。
# 一键部署：python tools/deploy_nas.py deploy --host <NAS-IP> --profile dev
# 说明见 docs/06-部署与运维.md §4.5。

name: pet-v2-dev

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PET_DEV_PORT:-8089}:80"   # 生产占 8088；TLS 仍由前置反代终结
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      # 数学课程视频（与生产同一目录，只读）
      - ${PET_MATH_MEDIA:-/vol2/1000/media/felix/math}:/media/math:ro
    depends_on:
      - api

  api:
    build:
      context: ../backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    # 必须与生产的 pet-api:latest 区分，否则重建 dev 会覆盖生产镜像
    image: pet-api:dev
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - TZ=Asia/Shanghai
      - PET_JWT_SECRET=${PET_JWT_SECRET:?请在 deploy/.env 设置}
      # 开发环境默认 1：顶栏显示 DEV，AI/SOE 走模拟，不发起外部调用
      - PET_DEV_MODE=${PET_DEV_MODE:-1}
      - PET_DATABASE_URL=sqlite:///./data/pet.db
    volumes:
      # 相对 dev 项目根目录，与生产 /vol1/1000/docker/pet-v2/data 完全隔离
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
