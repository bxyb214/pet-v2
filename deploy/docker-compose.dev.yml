# 开发环境（macOS / Windows 统一）：Vite HMR + uvicorn --reload
# 启动：python tools/dev.py up   → http://localhost:5173
# 数据：../data/dev（已 gitignore），与生产 ../data 完全隔离
name: pet-v2-dev

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    image: pet-api-dev:latest
    init: true
    environment:
      TZ: Asia/Shanghai
      PET_DEV_MODE: "1"
      # 固定开发密钥（PET_DEV_MODE=1 时生产密钥校验不生效）；不要用于任何正式环境
      PET_JWT_SECRET: pet-dev-insecure-jwt-secret-do-not-use-in-prod
      PET_DATABASE_URL: sqlite:////app/data/pet.db
      # 1=强制 watchfiles 轮询（Docker Desktop 挂载盘收不到文件事件时）；默认 0
      DEV_POLL: ${DEV_POLL:-0}
    volumes:
      - ../backend:/app
      - ../data/dev:/app/data
      # 部分测试会 import tools/ 下的迁移/审计脚本（测试按 /tools 找）
      - ../tools:/tools:ro
      # 遮住宿主平台的 .venv（Windows/macOS 二进制不能混用）
      - /app/.venv
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - |
        if [ "$DEV_POLL" = "1" ]; then export WATCHFILES_FORCE_POLLING=1; fi
        alembic upgrade head
        python -m app.bootstrap
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    image: node:22-alpine
    init: true
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      VITE_API_TARGET: http://api:8000
      VITE_USE_POLLING: ${DEV_POLL:-}
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    volumes:
      - ../frontend:/app
      - pet_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command:
      - sh
      - -c
      - |
        if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
        exec npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:22-alpine 的 localhost 解析到 ::1，而 Vite 只监听 IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  pet_node_modules:
