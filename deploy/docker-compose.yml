services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:80"          # 前置 TLS 由路由器/飞牛反代终结，这里只收 HTTP
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # dist 内含前端静态 + data/*.json + audio(85MB) + img，全部由 vite 拷贝
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

  api:
    build:
      context: ../backend
      args:
        # 国内装依赖走清华源；需要换源在 deploy/.env 里设 PIP_INDEX_URL
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    image: pet-api:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - TZ=Asia/Shanghai
      - PET_JWT_SECRET=${PET_JWT_SECRET:?请在 deploy/.env 设置}
      # 开发/测试环境置 1：顶栏显示 DEV，AI 接口返回模拟结果，不调用外部服务
      - PET_DEV_MODE=${PET_DEV_MODE:-0}
      # Qwen/腾讯 SOE 的 Key 不走环境变量：部署后在管理页（/admin）配置，存 app_cfg 表
      - PET_DATABASE_URL=sqlite:///./data/pet.db
    volumes:
      - ../data:/app/data   # SQLite + tts 缓存，务必挂卷持久化
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
