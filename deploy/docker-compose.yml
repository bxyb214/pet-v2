services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:80"          # 前置 TLS 由路由器/飞牛反代终结，这里只收 HTTP
    volumes:
      # 挂目录而不是单文件：改配置后 nginx -s reload 即可，不再需要 --force-recreate
      - ./nginx:/etc/nginx/conf.d:ro
      # dist 内含前端静态 + data/*.json + audio(85MB) + img，全部由 vite 拷贝
      - ../frontend/dist:/usr/share/nginx/html:ro
      # 数学课程视频：NAS 宿主目录只读挂载（可用 deploy/.env 的 PET_MATH_MEDIA 覆盖）
      - ${PET_MATH_MEDIA:-/vol2/1000/media/felix/math}:/media/math:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 用 127.0.0.1：alpine 里 localhost 可能先解析到 ::1，而 nginx 默认只听 IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/manifest.webmanifest"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../backend
      args:
        # 国内装依赖走清华源；需要换源在 deploy/.env 里设 PIP_INDEX_URL
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    # 发布时由 tools/deploy_nas.py 传 PET_TAG；日常重启默认 latest
    image: pet-api:${PET_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "8000"
    environment:
      - TZ=Asia/Shanghai
      - PET_JWT_SECRET=${PET_JWT_SECRET:?请在 deploy/.env 设置}
      # 开发/测试环境置 1：顶栏显示 DEV，AI 接口返回模拟结果，不调用外部服务
      - PET_DEV_MODE=${PET_DEV_MODE:-0}
      # 数学视频媒体令牌有效期（小时）；不设则默认 6
      - PET_MEDIA_TOKEN_HOURS=${PET_MEDIA_TOKEN_HOURS:-6}
      # Qwen/腾讯 SOE 的 Key 不走环境变量：部署后在管理页（/admin）配置，存 app_cfg 表
      - PET_DATABASE_URL=sqlite:///./data/pet.db
    volumes:
      - ../data:/app/data   # SQLite + tts 缓存 + backups，务必挂卷持久化
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
