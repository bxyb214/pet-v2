# PET v2 — nginx 配置（容器内）
# TLS 由前置层（路由器端口映射 / NAS 反代）终结，这里只管 HTTP。

server {
    listen 80;
    server_name _;

    # 前端静态产物（dist 内含 data/*.json、audio、img）
    root /usr/share/nginx/html;
    index index.html;

    # API 反代
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # 数学课程视频：只读卷挂载 NAS 媒体目录，sendfile 直出，支持 Range 拖动
    location /media/math/ {
        alias /media/math/;
        add_header Cache-Control "public, max-age=3600";
        gzip off;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 数据清单会随构建更新，文件名不带哈希：每次用 ETag 协商，避免浏览器拿旧题库
    location ~* ^/data/.*\.json$ {
        add_header Cache-Control "no-cache";
    }

    # index.html 同理：确保地址栏刷新能拿到新构建
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
